name: Windows build and release

on:
  push:
    branches: [main, codex/independent-editing-projects]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moments-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check media binaries
        run: |
          $expected = @{
            'ffmpeg.exe' = '557e97af30a1c9b6dfbd08a1d2a04894279dd15a77d23b1723e560cc7f4fc90e'
            'ffprobe.exe' = '11cb2352bac147bb8906f567af9af1da3779eca73e7a71a49a81c7d277e289cd'
          }
          foreach ($name in $expected.Keys) {
            if ((Get-FileHash "tools/$name" -Algorithm SHA256).Hash -ne $expected[$name]) {
              throw "Missing or unexpected Git LFS binary: $name"
            }
            & "./tools/$name" -version
            if ($LASTEXITCODE) { throw "$name failed to start" }
          }
      - name: Audio continuity and encoder stall regression tests
        run: |
          dotnet run --project tests/audio-continuity/AudioContinuityTests.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE) { throw 'Audio continuity tests failed' }
      - name: LoL auto-save regression tests
        run: |
          dotnet run --project tests/autosave/AutoSaveTests.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE) { throw 'Auto-save tests failed' }
      - name: GitHub update download tests
        run: |
          dotnet run --project tests/updates/UpdateTests.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE) { throw 'Update tests failed' }
      - name: Build Windows application
        run: ./build.ps1
      - name: Update installation and restart regression tests
        run: |
          dotnet run --project tests/installer/InstallerTests.csproj -c Release -p:NuGetAudit=false -- "$PWD"
          if ($LASTEXITCODE) { throw 'Update installer tests failed' }
      - name: Compile Windows integration tests
        run: |
          dotnet build tests/montage/MontageTests.csproj -c Release --configfile NuGet.Config -p:NuGetAudit=false
          if ($LASTEXITCODE) { throw 'Windows integration test build failed' }
      - name: Library, update UI, A/V sync and live video cadence tests
        run: ./tests/features.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-ui-checks
          path: |
            build/*.png
            build/*verification.txt
          if-no-files-found: ignore
      - name: Package Windows x64
        id: package
        run: |
          [xml]$project = Get-Content src/Moments.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $stage = 'build/package'
          New-Item -ItemType Directory -Force "$stage/tools", 'dist' | Out-Null
          Copy-Item Moments.exe, Moments.dll, Moments.deps.json, Moments.runtimeconfig.json, Moments.Updater.exe, Moments.Updater.dll, Moments.Updater.deps.json, Moments.Updater.runtimeconfig.json, README.md $stage
          Copy-Item tools/ffmpeg.exe, tools/ffprobe.exe, tools/LICENSE, tools/README.txt "$stage/tools"
          $zip = "Moments-$version-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zip"
          $hash = (Get-FileHash "dist/$zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "dist/$zip.sha256" -Encoding ascii
          @"
          Moments $version for Windows 11 x64.

          Clip previews and the montage editor now open as independent, nonmodal windows. Add A–B to timeline appends the kept selection and enabled audio tracks to the current montage; Add source reuses that same montage. Existing edits are preserved and each send can be undone in one step.

          New project, Open project and Save project as store separate .moments projects, autosave edits in the active project, and reopen the last project. New projects preserve previous montages. Source videos remain separate files referenced by the project.

          Library list and tiles now show saved event types (Kill, Double kill, Triple kill, etc.) with repeated-event counts. Version 1.1.4 users can install this release with Settings → Updates → Update and restart.

          Audio preview uses decoded PCM WAV instead of the Windows AAC decoder. New multi-track files include a default AAC-LC stereo playback mix while retaining separate editable stems. Existing files can be re-exported for compatibility.

          Download **$zip**, extract the whole archive to a writable folder, and run **Moments.exe**. FFmpeg and FFprobe are included. Requires **.NET Desktop Runtime 10 x64**.

          Validation: Windows builds; independent-window/input/lifecycle checks; A–B range, audio selection, mixed-FPS, undo/redo, queued-send and project-switch tests; decoded selection export; project persistence and library event-badge UI checks; silent-first-track/default-mix/PCM-preview checks; update/restart/rollback and existing audio, LoL, sync and cadence regressions.

          Source commit: $env:GITHUB_SHA
          SHA-256: $hash
          "@ | Set-Content dist/release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: moments-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moments-win-x64
          path: dist
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its files unchanged. Bump Version to publish another release."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Moments $RELEASE_VERSION" --notes-file dist/release-notes.md --draft dist/*.zip dist/*.sha256
          gh release edit "$tag" --draft=false --latest
